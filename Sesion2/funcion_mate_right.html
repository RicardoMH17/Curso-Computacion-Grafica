<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de función3</title>
</head>
<body>
    <h2>Grafico de una funcion3</h2>
    <h3>Realizado por Ricardo M. Huaman A.</h3>
    <canvas id="myCanvas" width="500" height="500" style="border: 1px solid black;"></canvas>
    <script>
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext('2d');

        // Dibujar ejes
        ctx.beginPath();
        ctx.moveTo(0, 250);   // eje X
        ctx.lineTo(500, 250);
        ctx.moveTo(250, 0);   // eje Y
        ctx.lineTo(250, 500);
        ctx.stroke();

        // Funcion a graficar: f(y) = y^2 hacia la derecha
        ctx.beginPath();
        ctx.strokeStyle = "blue";

        for (var y = -250; y < 250; y++) {
            var x = Math.pow(y, 2) / 100;
            ctx.lineTo(250 + x, 250 + y);
        }

        ctx.strokeStyle = 'blue';
        ctx.stroke();
    </script>
</body>
</html>
