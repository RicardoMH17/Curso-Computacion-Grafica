<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circulo</title>
</head>
<body>
    <h2>Dibujo de un círculo </h2>
    <h3>Realizado por: Ricardo Manuel Huaman Ataulluco</h3>
    <!--DEFINIR UN AREA DE DIBUJO CON EL ELEMENTO CANVAS -->
    <canvas id ="myCanvas" width="500" height="500" style="border:10px solid #1DAE56;"></canvas>
    <!-- CODIGO CANVAS  -->
    <script>
        //OBTENER EL CONTEXTO DE DIBUJO DEL CANVAS 
        var canvas =document.getElementById("myCanvas");
        //se obtiene el contexto de dibujo en 2d 
        var ctx = canvas.getContext("2d");
        //coemnzar el trazado de una (circulo en este punto se inicia el dibujo)
        ctx.beginPath();
        //dibujar el arco para representar el circulo
                //las cordenadas (x,y)ubica ene le centro 
            // el radio del circulo es de 100 pixeles 

        ctx.arc(250, 250, 100,0, 2 *Math.PI);

        //defeinir el color del relleno del circulo 
        ctx.fillStyle = "lightgreen";
        //rellenar el circulo  con el color definido 
        ctx.fill();
        
        //dibujar el borde del circulo con un color distinto
        ctx.stroque()
    </script>
</body>
</html>
