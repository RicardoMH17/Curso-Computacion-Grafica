<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotación Tridimensional de un Cubo en los Ejes X y Y</title>
    <style>
        /* estilo general de la pagina */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* caja de informacion del ejercicio */
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: #00ff88;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #00ff88;
            font-size: 14px;
            line-height: 1.8;
        }
        /* titulo del ejercicio */
        #info h1 {
            color: #00ff88;
            margin: 0 0 6px 0;
            font-size: 25px;
        }
        /* nombre del autor */
        #info h2 {
            color: #a0c4ff;
            margin: 0 0 6px 0;
            font-size: 20px;
            font-weight: normal;
        }
        /* controles de rotacion */
        #info p {
            color: #ffffff;
            margin: 2px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- informacion del ejercicio visible en pantalla -->
    <div id="info">
        <h1>Rotación Tridimensional - Ejes X y Y</h1>
        <h2>Realizado por: Ricardo M. Huaman A.</h2>
        <p>Tecla <b>1</b>: Rotar solo en eje X</p>
        <p>Tecla <b>2</b>: Rotar solo en eje Y</p>
        <p>Tecla <b>3</b>: Rotar en ambos ejes X y Y</p>
    </div>

    <!-- IMPORTAR LA LIBRERIA THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- EJERCICIO DE ROTACIÓN EN LOS EJES X Y Y -->
    <script>

        // CREAR LA ESCENA
        const scene = new THREE.Scene();
        // definir el color de fondo de la escena
        scene.background = new THREE.Color(0x20232a);

        // CREAR LA CÁMARA FRONTAL
        // parametros: campo de vision, relacion de aspecto, plano cercano, plano lejano
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // CREAR EL RENDERIZADOR
        const renderer = new THREE.WebGLRenderer();
        // ajustar el tamaño del renderizador al tamaño de la ventana
        renderer.setSize(window.innerWidth, window.innerHeight);
        // agregar el renderizador al cuerpo del documento
        document.body.appendChild(renderer.domElement);

        // CREAR EL CUBO
        // parametros: ancho, alto, profundidad
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        // material que muestra los colores de los ejes automaticamente
        const material = new THREE.MeshNormalMaterial();
        // unir geometria y material para formar el objeto
        const cubo = new THREE.Mesh(geometry, material);
        // agregar el cubo a la escena
        scene.add(cubo);

        // AGREGAR LUZ A LA ESCENA
        // luz puntual para mejorar la apariencia del cubo
        const light = new THREE.PointLight(0xffffff, 1);
        // posicionar la luz en la escena
        light.position.set(5, 5, 5);
        // agregar la luz a la escena
        scene.add(light);

        // POSICIONAR LA CÁMARA
        // alejar la camara en el eje z para ver el cubo de frente
        camera.position.z = 5;

        // VARIABLE PARA CONTROLAR EL MODO DE ROTACIÓN
        // modo 1 = solo eje X, modo 2 = solo eje Y, modo 3 = ambos ejes
        let modoRotacion = 3;

        // ESCUCHAR LAS TECLAS PARA CAMBIAR EL MODO DE ROTACIÓN
        window.addEventListener('keydown', (event) => {
            switch(event.key) {
                case '1':
                    modoRotacion = 1; // activar solo rotacion en eje X
                    break;
                case '2':
                    modoRotacion = 2; // activar solo rotacion en eje Y
                    break;
                case '3':
                    modoRotacion = 3; // activar rotacion en ambos ejes
                    break;
            }
        });

        // FUNCIÓN DE ANIMACIÓN
        function animate() {
            // llamar a la funcion de animacion en cada frame
            requestAnimationFrame(animate);

            // ROTACIÓN SEGÚN EL MODO SELECCIONADO
            if (modoRotacion === 1) {
                // rotar solo en el eje X
                cubo.rotation.x += 0.01;
            } else if (modoRotacion === 2) {
                // rotar solo en el eje Y
                cubo.rotation.y += 0.02;
            } else if (modoRotacion === 3) {
                // rotar en ambos ejes X y Y simultaneamente
                cubo.rotation.x += 0.01;
                cubo.rotation.y += 0.01;
            }

            // DIBUJAR LA ESCENA con la camara y los objetos actualizados
            renderer.render(scene, camera);
        }

        // EJECUTAR LA ANIMACIÓN
        animate();

        // AJUSTE RESPONSIVO al cambiar el tamaño de la ventana
        window.addEventListener('resize', () => {
            // actualizar la relacion de aspecto de la camara
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // actualizar el tamaño del renderizador
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
