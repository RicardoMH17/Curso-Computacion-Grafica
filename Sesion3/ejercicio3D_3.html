<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRASLACIÓN, ROTACIÓN Y ESCALADO</title>
    <style>
        /* estilo general de la pagina */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* caja informativa de controles */
        #info { 
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 8px;
            border-left: 3px solid #00ff88;
            font-size: 14px;
        }
        /* titulo de la caja informativa */
        #info h1 {
            color: #00ff88;
            margin: 0 0 4px 0;
            font-size: 25px;
        }
        /* nombre del autor */
        #info h2 {
            color: #a0c4ff;
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: normal;
        }
        /* texto de controles */
        #info p {
            color: #ffffff;
            margin: 2px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- instrucciones para el usuario -->
    <div id="info">
        <h2>Traslación, Rotación y Escalado</h2>
        <h3>Realizado por: Ricardo Manuel Huaman Ataulluco</h3>
        <p>FLECHAS: Mover el cubo</p>
        <p>Q / E : Rotar el cubo</p>
        <p>Z / X : Escalar el cubo</p>
    </div>

    <!-- importamos Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <!-- EJERCICIO DE TRASLACIÓN, ROTACIÓN Y ESCALADO -->
    <script>
        // CREAR LA ESCENA
        const scene = new THREE.Scene();
        // crear el fondo de la escena
        scene.background = new THREE.Color(0x20232a);
        // CREAR UNA CAMARA
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // CREAR UN RENDERIZADOR
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        // CREAR EL OBJETO 3D
        const geometry = new THREE.BoxGeometry(1,1,1);
        const material = new THREE.MeshNormalMaterial();
        const cubo = new THREE.Mesh(geometry, material);
        scene.add(cubo);

        // agregar una luz direccional para mejorar la apariencia del cubo
        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);

        // POSICIONAR LA CAMARA
        camera.position.z = 5;

        // variables para controlar la dirección del movimiento mediante teclado
        window.addEventListener('keydown', (event) => {
            switch(event.key) {

                //traslación
                case 'ArrowUp':
                    cubo.position.y += 0.2; // mover hacia arriba
                    // limite superior
                    if (cubo.position.y > 3) cubo.position.y = 3;
                    break;
                case 'ArrowDown':
                    cubo.position.y -= 0.2; // mover hacia abajo
                    // limite inferior
                    if (cubo.position.y < -3) cubo.position.y = -3;
                    break;
                case 'ArrowLeft':
                    cubo.position.x -= 0.2; // mover hacia la izquierda
                    // limite izquierdo
                    if (cubo.position.x < -4) cubo.position.x = -4;
                    break;
                case 'ArrowRight':
                    cubo.position.x += 0.2; // mover hacia la derecha
                    // limite derecho
                    if (cubo.position.x > 4) cubo.position.x = 4;
                    break;

                // ROTACIÓN
                case 'q':
                case 'Q':
                    cubo.rotation.y -= 0.1; // rotar a la izquierda
                    break;
                case 'e':
                case 'E':
                    cubo.rotation.y += 0.1; // rotar a la derecha
                    break;

                // ESCALADO
                case 'z':
                case 'Z':
                    cubo.scale.x += 0.1;
                    cubo.scale.y += 0.1;
                    cubo.scale.z += 0.1;
                    // escalar hacia arriba
                    break;
                case 'x':
                    cubo.scale.x = Math.max(0.2, cubo.scale.x - 0.1); // limitar el escalado hacia abajo
                    cubo.scale.y = Math.max(0.2, cubo.scale.y - 0.1);
                    cubo.scale.z = Math.max(0.2, cubo.scale.z - 0.1); // escalar hacia abajo
                    break;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            // DIBUJAR LA ESCENA
            renderer.render(scene, camera);
        }
        animate();

        // AJUSTE RESPONSIVO
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
