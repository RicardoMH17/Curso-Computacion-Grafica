<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traslación, Rotación y Escalado en un Objeto 3D</title>
    <style>
        /* estilo general de la pagina */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* caja de informacion y controles */
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #00ff88;
            font-size: 13px;
            line-height: 2;
        }
        /* titulo del ejercicio */
        #info h1 {
            color: #00ff88;
            margin: 0 0 4px 0;
            font-size: 25px;
        }
        /* nombre del autor */
        #info h2 {
            color: #a0c4ff;
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: normal;
        }
        /* subtitulo de cada grupo de controles */
        #info b {
            color: #00ff88;
        }
    </style>
</head>
<body>

    <!-- panel de instrucciones visible en pantalla -->
    <div id="info">
        <h1>Traslación, Rotación y Escalado 3D</h1>
        <h2>Realizado por: Ricardo M. Huaman A.</h2>
        <b>TRASLACIÓN:</b><br>
        ↑ ↓ ← → : Mover en X y Y<br>
        W / S : Mover en eje Z<br>
        <b>ROTACIÓN:</b><br>
        Q / E : Rotar en eje Y<br>
        O / L : Rotar en eje X<br>
        <b>ESCALADO:</b><br>
        A : Aumentar tamaño<br>
        D : Reducir tamaño
    </div>

    <!-- IMPORTAR LA LIBRERIA THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- EJERCICIO DE TRASLACIÓN, ROTACIÓN Y ESCALADO -->
    <script>

        // CREAR LA ESCENA
        const scene = new THREE.Scene();
        // definir el color de fondo de la escena
        scene.background = new THREE.Color(0x20232a);

        // CREAR LA CÁMARA
        // parametros: campo de vision, relacion de aspecto, plano cercano, plano lejano
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // CREAR EL RENDERIZADOR
        const renderer = new THREE.WebGLRenderer();
        // ajustar el tamaño del renderizador al tamaño de la ventana
        renderer.setSize(window.innerWidth, window.innerHeight);
        // agregar el renderizador al cuerpo del documento
        document.body.appendChild(renderer.domElement);

        // CREAR EL OBJETO 3D PRINCIPAL
        // parametros: ancho, alto, profundidad
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        // material que muestra los colores de los ejes automaticamente
        const material = new THREE.MeshNormalMaterial();
        // unir geometria y material para formar el objeto
        const cubo = new THREE.Mesh(geometry, material);
        // agregar el cubo a la escena
        scene.add(cubo);

        // AGREGAR LUZ A LA ESCENA
        // luz puntual para mejorar la apariencia del cubo
        const light = new THREE.PointLight(0xffffff, 1);
        // posicionar la luz arriba a la derecha
        light.position.set(5, 5, 5);
        // agregar la luz a la escena
        scene.add(light);

        // POSICIONAR LA CÁMARA
        // alejar la camara en el eje z para ver el cubo de frente
        camera.position.z = 5;

        // ESCUCHAR LAS TECLAS DEL TECLADO PARA CONTROLAR EL CUBO
        window.addEventListener('keydown', (event) => {
            switch(event.key) {

                // TRASLACIÓN: mover el cubo en el eje Y
                case 'ArrowUp':
                    cubo.position.y += 0.2; // mover hacia arriba
                    break;
                case 'ArrowDown':
                    cubo.position.y -= 0.2; // mover hacia abajo
                    break;

                // TRASLACIÓN: mover el cubo en el eje X
                case 'ArrowLeft':
                    cubo.position.x -= 0.2; // mover hacia la izquierda
                    break;
                case 'ArrowRight':
                    cubo.position.x += 0.2; // mover hacia la derecha
                    break;

                // TRASLACIÓN: mover el cubo en el eje Z
                case 'w':
                case 'W':
                    cubo.position.z -= 0.2; // mover hacia adelante
                    break;
                case 's':
                case 'S':
                    cubo.position.z += 0.2; // mover hacia atras
                    break;

                // ROTACIÓN: rotar el cubo en el eje Y
                case 'q':
                case 'Q':
                    cubo.rotation.y -= 0.1; // rotar a la izquierda
                    break;
                case 'e':
                case 'E':
                    cubo.rotation.y += 0.1; // rotar a la derecha
                    break;

                // ROTACIÓN: rotar el cubo en el eje X
                case 'o':
                case 'O':
                    cubo.rotation.x -= 0.1; // rotar hacia arriba
                    break;
                case 'l':
                case 'L':
                    cubo.rotation.x += 0.1; // rotar hacia abajo
                    break;

                // ESCALADO: aumentar el tamaño del cubo en los tres ejes
                case 'a':
                case 'A':
                    cubo.scale.x += 0.1; // aumentar en eje X
                    cubo.scale.y += 0.1; // aumentar en eje Y
                    cubo.scale.z += 0.1; // aumentar en eje Z
                    break;

                // ESCALADO: reducir el tamaño del cubo con limite minimo
                case 'd':
                case 'D':
                    cubo.scale.x = Math.max(0.2, cubo.scale.x - 0.1); // limitar en X
                    cubo.scale.y = Math.max(0.2, cubo.scale.y - 0.1); // limitar en Y
                    cubo.scale.z = Math.max(0.2, cubo.scale.z - 0.1); // limitar en Z
                    break;
            }
        });

        // FUNCIÓN DE ANIMACIÓN
        function animate() {
            // llamar a la funcion de animacion en cada frame
            requestAnimationFrame(animate);
            // DIBUJAR LA ESCENA con la camara y los objetos actualizados
            renderer.render(scene, camera);
        }

        // EJECUTAR LA ANIMACIÓN
        animate();

        // AJUSTE RESPONSIVO al cambiar el tamaño de la ventana
        window.addEventListener('resize', () => {
            // actualizar la relacion de aspecto de la camara
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // actualizar el tamaño del renderizador
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
