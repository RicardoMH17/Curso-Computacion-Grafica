<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desplazamiento Lineal de un Cubo en el Espacio Tridimensional</title>
    <style>
        /* estilo general de la pagina */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        /* caja de informacion del ejercicio */
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: #00ff88;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #00ff88;
            font-size: 14px;
            line-height: 1.8;
        }
        /* titulo del ejercicio */
        #info h1 {
            color: #00ff88;
            margin: 0 0 6px 0;
            font-size: 25px;
        }
        /* nombre del autor */
        #info h2 {
            color: #a0c4ff;
            margin: 0;
            font-size: 20px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <!-- informacion del ejercicio visible en pantalla -->
    <div id="info">
        <h1>Traslación de un Cubo en el Eje X</h1>
        <h2>Realizado por: Ricardo M. Huaman A.</h2>
        <p>El cubo se desplaza de izquierda a derecha sobre el eje X</p>
    </div>

    <!-- IMPORTAR LA LIBRERIA THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- EJERCICIO DE TRASLACIÓN EN EL EJE X -->
    <script>

        // CREAR LA ESCENA
        const scene = new THREE.Scene();
        // definir el color de fondo de la escena
        scene.background = new THREE.Color(0x20232a);

        // CREAR LA CÁMARA
        // parametros: campo de vision, relacion de aspecto, plano cercano, plano lejano
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // CREAR EL RENDERIZADOR
        const renderer = new THREE.WebGLRenderer();
        // ajustar el tamaño del renderizador al tamaño de la ventana
        renderer.setSize(window.innerWidth, window.innerHeight);
        // agregar el renderizador al cuerpo del documento
        document.body.appendChild(renderer.domElement);

        // CREAR EL CUBO
        // parametros: ancho, alto, profundidad
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        // material que muestra los colores de los ejes automaticamente
        const material = new THREE.MeshNormalMaterial();
        // unir geometria y material para formar el objeto
        const cubo = new THREE.Mesh(geometry, material);
        // agregar el cubo a la escena
        scene.add(cubo);

        // POSICIONAR LA CAMARA
        // alejar la camara en el eje z para ver el cubo de frente
        camera.position.z = 5;

        // VARIABLE PARA CONTROLAR LA DIRECCIÓN DEL MOVIMIENTO
        // valor positivo = mueve a la derecha, negativo = mueve a la izquierda
        let direccion = 0.03;

        // FUNCIÓN DE ANIMACIÓN
        function animate() {
            // llamar a la funcion de animacion en cada frame
            requestAnimationFrame(animate);

            // TRASLACIÓN: mover el cubo en el eje X sumando la dirección
            cubo.position.x += direccion;

            // CAMBIAR DIRECCIÓN si el cubo llega al límite derecho
            if (cubo.position.x > 5) {
                direccion = -0.03; // invertir hacia la izquierda
            }

            // CAMBIAR DIRECCIÓN si el cubo llega al límite izquierdo
            if (cubo.position.x < -5) {
                direccion = 0.03; // invertir hacia la derecha
            }

            // DIBUJAR LA ESCENA con la camara y los objetos actualizados
            renderer.render(scene, camera);
        }

        // EJECUTAR LA ANIMACIÓN
        animate();

        // AJUSTE RESPONSIVO al cambiar el tamaño de la ventana
        window.addEventListener('resize', () => {
            // actualizar la relacion de aspecto de la camara
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // actualizar el tamaño del renderizador
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
